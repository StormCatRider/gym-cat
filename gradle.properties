# PLAIN-ENGLISH GUIDE — gradle.properties
# Global switches for the build. Memory for Gradle, AndroidX on, and
# Kotlin "official" code style.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.9.1 officially lists compileSdk 35 as its max; this silences the warning for 36
# (same setting as Gym & Ñam).
android.suppressUnsupportedCompileSdk=36
